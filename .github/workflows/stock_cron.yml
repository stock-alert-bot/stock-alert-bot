name: Check Stock Prices

on:
  schedule:
    # ตั้งค่าให้รันทุกๆ 1 ชั่วโมง ของทุกวัน ตลอด 24 ชั่วโมง
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance

      - name: Run script
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: |
          python your_script_name.py  # เปลี่ยนเป็นชื่อไฟล์ Python ของคุณ

      - name: Commit and push if state changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update stock state [skip ci]" && git push)
